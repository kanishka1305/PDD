[pytest]
# ── DentAI Mobile — Appium E2E Test Suite ─────────────────────────────────────
testpaths = appium/tests

# ── Output ────────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --durations=10
    --junitxml=appium/reports/results.xml
    --no-header

# ── Logging ───────────────────────────────────────────────────────────────────
log_cli            = true
log_cli_level      = INFO
log_cli_format     = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

log_file           = appium/reports/logs/pytest.log
log_file_level     = DEBUG
log_file_format    = %(asctime)s [%(levelname)s] %(name)s %(filename)s:%(lineno)d: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ── Markers ───────────────────────────────────────────────────────────────────
markers =
    smoke:    Fast smoke tests (app launch, login)
    e2e:      Full end-to-end workflow tests
    slow:     Long-running tests (AI segmentation waits)
    tc_id:    Test case ID (TC-APP-NNN)
    module:   Module name for reporting
    precond:  Precondition description for reporting
    steps:    Test steps description for reporting
    expected: Expected result for reporting

# ── Timeouts ──────────────────────────────────────────────────────────────────
# Individual test timeout handled in code via explicit waits.
# Use pytest-timeout plugin for global timeout if needed:
# timeout = 300

# ── Collection ────────────────────────────────────────────────────────────────
python_files   = test_*.py
python_classes = Test*
python_functions = test_*

# ── Filter warnings ───────────────────────────────────────────────────────────
filterwarnings =
    ignore::DeprecationWarning:appium.*
    ignore::DeprecationWarning:selenium.*
    ignore::UserWarning
