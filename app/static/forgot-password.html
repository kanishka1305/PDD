<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — DentAI</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">

    <div class="logo">
      <div class="logo-mark">
        <i data-lucide="scan-face" style="width:26px;height:26px;color:#fff;"></i>
      </div>
      <span class="brand-name">DentAI</span>
      <p>CBCT AI Segmentation Platform</p>
    </div>

    <h2>Forgot Password</h2>
    <p class="sub">Enter your registered email and we'll generate a reset link</p>

    <div class="alert error"   id="alert-err" role="alert"></div>
    <div class="alert success" id="alert-ok"  role="status"></div>

    <form id="fp-form" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="doctor@hospital.com" autocomplete="email" required />
      </div>
      <button class="btn-primary" type="submit" id="btn">
        <i data-lucide="send" style="width:16px;height:16px;"></i>
        Send Reset Link
      </button>
    </form>

    <div class="auth-footer" style="margin-top:24px;">
      <a href="/login" style="display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;font-size:13px;font-weight:500;">
        <i data-lucide="arrow-left" style="width:14px;height:14px;"></i>
        Back to Login
      </a>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
  lucide.createIcons();

  document.getElementById('fp-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const err = document.getElementById('alert-err');
    const ok  = document.getElementById('alert-ok');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Sending…';
    err.style.display = 'none';
    ok.style.display  = 'none';

    try {
      const data = await postForm('/forgot-password', {
        email: document.getElementById('email').value.trim()
      });

      if (data.success) {
        if (data.reset_token) {
          ok.textContent   = 'Reset link ready! Redirecting…';
          ok.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/reset-password?token=' + encodeURIComponent(data.reset_token);
          }, 1000);
        } else {
          ok.textContent   = data.message;
          ok.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="send" style="width:16px;height:16px;"></i> Send Reset Link';
          lucide.createIcons();
        }
      } else {
        err.textContent   = data.message || 'Something went wrong. Please try again.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="send" style="width:16px;height:16px;"></i> Send Reset Link';
        lucide.createIcons();
      }
    } catch {
      err.textContent   = 'Cannot reach server.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="send" style="width:16px;height:16px;"></i> Send Reset Link';
      lucide.createIcons();
    }
  });
</script>
</body>
</html>
