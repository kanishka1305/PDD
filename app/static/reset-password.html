<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — DentAI</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">

    <div class="logo">
      <div class="logo-mark">
        <i data-lucide="scan-face" style="width:26px;height:26px;color:#fff;"></i>
      </div>
      <span class="brand-name">DentAI</span>
      <p>CBCT AI Segmentation Platform</p>
    </div>

    <h2>Reset Password</h2>
    <p class="sub">Enter your new password below</p>

    <div class="alert error"   id="alert-err" role="alert"></div>
    <div class="alert success" id="alert-ok"  role="status"></div>

    <form id="rp-form" novalidate>
      <div class="form-group">
        <label for="new-password">New Password</label>
        <div class="pw-wrap">
          <input type="password" id="new-password" placeholder="Min 8 chars, 1 uppercase, 1 number, 1 special" autocomplete="new-password" required />
          <span class="pw-eye" onclick="toggleEye('new-password','eye1')" title="Show / hide password" aria-label="Toggle password visibility">
            <i data-lucide="eye" id="eye1" style="width:16px;height:16px;"></i>
          </span>
        </div>
        <div class="pw-strength-bar"><div class="pw-strength-fill" id="pw-fill"></div></div>
        <div class="pw-strength-text" id="pw-strength-text"></div>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm New Password</label>
        <div class="pw-wrap">
          <input type="password" id="confirm-password" placeholder="Re-enter new password" autocomplete="new-password" required />
          <span class="pw-eye" onclick="toggleEye('confirm-password','eye2')" title="Show / hide password" aria-label="Toggle password visibility">
            <i data-lucide="eye" id="eye2" style="width:16px;height:16px;"></i>
          </span>
        </div>
      </div>
      <button class="btn-primary" type="submit" id="btn">
        <i data-lucide="lock" style="width:16px;height:16px;"></i>
        Reset Password
      </button>
    </form>

    <div class="auth-footer" style="margin-top:24px;">
      <a href="/login" style="display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;font-size:13px;font-weight:500;">
        <i data-lucide="arrow-left" style="width:14px;height:14px;"></i>
        Back to Login
      </a>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
  lucide.createIcons();

  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');

  if (!token) {
    const err = document.getElementById('alert-err');
    err.textContent   = 'Invalid or missing reset token. Please request a new link.';
    err.style.display = 'block';
    document.getElementById('rp-form').style.display = 'none';
  }

  function toggleEye(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon  = document.getElementById(iconId);
    if (input.type === 'password') {
      input.type = 'text';
      icon.setAttribute('data-lucide', 'eye-off');
    } else {
      input.type = 'password';
      icon.setAttribute('data-lucide', 'eye');
    }
    lucide.createIcons();
  }

  document.getElementById('new-password').addEventListener('input', function () {
    const v = this.value;
    const fill = document.getElementById('pw-fill');
    const text = document.getElementById('pw-strength-text');
    if (!v) { fill.style.width = '0%'; text.textContent = ''; return; }
    const checks = [v.length >= 8, /[A-Z]/.test(v), /[a-z]/.test(v), /\d/.test(v), /[@#$%^&+=!]/.test(v)];
    const score = checks.filter(Boolean).length;
    const labels = ['', 'Very Weak', 'Weak', 'Fair', 'Strong', 'Very Strong'];
    const colors = ['', '#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'];
    fill.style.width      = (score / 5 * 100) + '%';
    fill.style.background = colors[score];
    text.textContent      = labels[score];
    text.style.color      = colors[score];
  });

  document.getElementById('rp-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const err = document.getElementById('alert-err');
    const ok  = document.getElementById('alert-ok');
    const np  = document.getElementById('new-password').value;
    const cp  = document.getElementById('confirm-password').value;

    err.style.display = 'none';
    ok.style.display  = 'none';

    if (np !== cp) {
      err.textContent   = 'Passwords do not match.';
      err.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Resetting…';

    try {
      const data = await postForm('/reset-password', { token, new_password: np });

      if (data.success) {
        ok.textContent   = data.message + ' Redirecting to login…';
        ok.style.display = 'block';
        setTimeout(() => window.location.href = '/login', 2000);
      } else {
        err.textContent   = data.message || 'Reset failed.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="lock" style="width:16px;height:16px;"></i> Reset Password';
        lucide.createIcons();
      }
    } catch {
      err.textContent   = 'Cannot reach server.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="lock" style="width:16px;height:16px;"></i> Reset Password';
      lucide.createIcons();
    }
  });
</script>
</body>
</html>
