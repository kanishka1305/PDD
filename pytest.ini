[pytest]
# ── Test discovery ────────────────────────────────────────────────────────────
testpaths = automation/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Core options ──────────────────────────────────────────────────────────────
# --strict-markers is intentionally OMITTED from addopts.
# Reason: it would fail the entire suite if any test file uses a marker that
# isn't declared here (e.g. from a newly added test). Markers are declared
# below for documentation only. Re-add --strict-markers if you want enforcement.
#
# -n / --html are passed on the CLI or in CI steps, NOT here.
# Reason: paths with spaces ("Test Results/HTML/") break on some platforms
# when embedded in addopts.
addopts =
    -v
    --tb=short
    -p no:warnings
    --color=yes

# ── Per-test timeout ──────────────────────────────────────────────────────────
# Requires: pytest-timeout
# timeout_method=thread is used instead of signal because:
#   - 'signal' only works on the main thread (breaks with xdist workers)
#   - 'thread' works cross-platform (Linux CI + Windows local)
timeout = 60
timeout_method = thread

# ── Markers ───────────────────────────────────────────────────────────────────
markers =
    smoke:      Fast smoke tests — verify core pages load
    critical:   Critical-path tests (login, upload, analysis)
    auth:       Authentication tests (TC-AUTH-*)
    authz:      Authorization / security tests (TC-AUTHZ-*)
    nav:        Navigation tests (TC-NAV-*)
    ui:         UI validation tests (TC-UI-*)
    form:       Form & input validation tests (TC-FORM-*, TC-INP-*)
    inp:        Input boundary / injection tests
    sess:       Session management tests (TC-SESS-*)
    file:       File upload tests (TC-FILE-*, TC-UPLOAD-*)
    upload:     Upload-specific tests
    history:    History page tests (TC-HIST-*)
    profile:    Profile & credential tests (TC-PROF-*, TC-RESET-*)
    reset:      Password reset tests
    acc:        Accessibility smoke tests (TC-ACC-*)
    resp:       Responsive design tests (TC-RESP-*)
    perf:       Performance smoke tests (TC-PERF-*)
    reg:        Regression suite (TC-REG-*)
    err:        Error handling tests (TC-ERR-*)
    slow:       Tests that take > 5 seconds

# ── Live log (console) ────────────────────────────────────────────────────────
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-8s] %(name)s — %(message)s
log_cli_date_format = %H:%M:%S

# ── File log ──────────────────────────────────────────────────────────────────
# IMPORTANT: the directory must exist before pytest starts.
# The CI step "Create result directories" creates it, and settings.py also
# creates it on import. Path uses forward slashes — works on Linux CI and
# Windows (Python handles the conversion).
log_file = Test Results/Logs/pytest-live.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)-8s] %(name)s — %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ── Warnings ──────────────────────────────────────────────────────────────────
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
