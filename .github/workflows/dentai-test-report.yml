          def F(c):  return PatternFill("solid", fgColor=c)
          def BD():
              s = Side(style="thin", color=C["border"])
              return Border(left=s, right=s, top=s, bottom=s)
          def FT(bold=False, color="FF2C3E50", size=10):
              return Font(name="Calibri", size=size, bold=bold, color=color)
          def AL(h="left", wrap=False):
              return Alignment(horizontal=h, vertical="center", wrap_text=wrap)

          def hdr_row(ws, headers, widths, row=1, bg="FF0D1B2A"):
              for ci, (h, w) in enumerate(zip(headers, widths), 1):
                  c = ws.cell(row, ci, h)
                  c.font = FT(True, C["white"], 10)
                  c.fill = F(bg); c.border = BD(); c.alignment = AL("center")
