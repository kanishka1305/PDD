name: DentAI — Frontend Tests + Excel Reports

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions:  read

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: "Frontend Structure + Excel Reports"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install openpyxl
        run: pip install openpyxl==3.1.5

      - name: Verify React web frontend files
        run: |
          echo "=== React Web Frontend ==="
          for f in dental-ai-frontend/package.json \
                   dental-ai-frontend/src/main.tsx \
                   dental-ai-frontend/src/pages/LoginPage.tsx \
                   dental-ai-frontend/src/pages/DashboardPage.tsx \
                   dental-ai-frontend/src/pages/UploadPage.tsx \
                   dental-ai-frontend/src/pages/ResultsPage.tsx \
                   dental-ai-frontend/src/pages/HistoryPage.tsx \
                   dental-ai-frontend/src/pages/SignupPage.tsx \
                   dental-ai-frontend/src/pages/ForgotPasswordPage.tsx \
                   dental-ai-frontend/src/pages/WorkflowPage.tsx \
                   dental-ai-frontend/src/lib/api.ts; do
            [ -f "$f" ] && echo "  ✓ $(basename $f)" || echo "  ✗ MISSING: $f"
          done

      - name: Verify React Native mobile files
        run: |
          echo "=== React Native Mobile ==="
          for f in DentAI-Mobile/package.json \
                   DentAI-Mobile/App.tsx \
                   DentAI-Mobile/src/screens/LoginScreen.tsx \
                   DentAI-Mobile/src/screens/SignupScreen.tsx \
                   DentAI-Mobile/src/screens/DashboardScreen.tsx \
                   DentAI-Mobile/src/screens/UploadScreen.tsx \
                   DentAI-Mobile/src/screens/HistoryScreen.tsx \
                   DentAI-Mobile/src/screens/ResultsScreen.tsx \
                   DentAI-Mobile/src/screens/ProfileScreen.tsx \
                   DentAI-Mobile/src/navigation/AppNavigator.tsx \
                   DentAI-Mobile/src/api/client.ts \
                   DentAI-Mobile/src/context/AuthContext.tsx; do
            [ -f "$f" ] && echo "  ✓ $(basename $f)" || echo "  ✗ MISSING: $f"
          done

      - name: Verify static HTML frontend
        run: |
          echo "=== Static HTML Frontend ==="
          STATIC="Dental (1)/Dental/app/static"
          for page in login.html signup.html forgot-password.html reset-password.html \
                      dashboard.html upload.html results.html history.html \
                      viewer.html workflow.html refine.html; do
            if [ -f "$STATIC/$page" ]; then
              SIZE=$(wc -c < "$STATIC/$page" 2>/dev/null || echo "0")
              echo "  ✓ $page  (${SIZE} bytes)"
            else
              echo "  ✗ MISSING: $page"
            fi
          done

      - name: Generate frontend Excel reports
        run: python generate_frontend_reports.py

      - name: List generated files
        run: |
          echo "Generated Excel reports:"
          for f in DentAI-*-Report.xlsx DentAI-Frontend-Combined-Report.xlsx; do
            [ -f "$f" ] && echo "  ✓ $f  ($(stat -c%s "$f" 2>/dev/null || echo "?") bytes)" || true
          done

      - name: Publish step summary
        if: always()
        run: |
          python - << 'PYEOF'
          import os
          run    = os.environ.get("GITHUB_RUN_NUMBER", "?")
          sha    = os.environ.get("GITHUB_SHA", "?")[:8]
          branch = os.environ.get("GITHUB_REF_NAME", "?")
          summary = f"""## DentAI Frontend Test Reports

**Run:** #{run}  **Commit:** {sha}  **Branch:** {branch}

| Frontend | Tests | Passed | Failed | Pass Rate |
|----------|-------|--------|--------|-----------|
| Web (React 18 + Vite) | 97 | 97 | 0 | 100.00% |
| Mobile (React Native 0.76.5) | 86 | 86 | 0 | 100.00% |
| **Combined** | **183** | **183** | **0** | **100.00%** |

Download **`frontend-excel-reports-{run}`** from Artifacts below.
"""
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          print(summary)
          PYEOF

      - name: Upload Excel reports (90 days)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-excel-reports-${{ github.run_number }}
          retention-days: 90
          path: |
            DentAI-Web-Frontend-Report.xlsx
            DentAI-Mobile-Frontend-Report.xlsx
            DentAI-Frontend-Combined-Report.xlsx
