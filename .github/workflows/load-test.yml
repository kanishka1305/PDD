name: Dental CBCT AI — Load Test

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Load Test Mode'
        required: true
        default: 'baseline'
        type: choice
        options:
          - baseline    # 1 user, 30s
          - light       # 5 users, 1m
          - medium      # 20 users, 2m
          - stress      # 50 users step load

jobs:
  load-test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dental_ai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Application Dependencies
        run: pip install -r requirements.txt

      - name: Install Load Testing Dependencies
        run: pip install -r load_testing/requirements.txt

      - name: Start FastAPI Application (Background)
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: dental_ai
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          # Wait for API to boot
          until curl -s http://127.0.0.1:8000/health; do sleep 2; done

      - name: Execute Load Test (${{ inputs.test_mode }})
        env:
          BASE_URL: "http://127.0.0.1:8000"
          LOAD_TEST_USERNAME: "ci_load_test@dentai.com"
          LOAD_TEST_PASSWORD: "CI_LoadTest@123"
        run: |
          if [ "${{ inputs.test_mode }}" == "baseline" ]; then
            locust -f load_testing/locustfile.py --headless -u 1 -r 1 -t 30s --host $BASE_URL
          elif [ "${{ inputs.test_mode }}" == "light" ]; then
            locust -f load_testing/locustfile.py --headless -u 5 -r 1 -t 1m --host $BASE_URL
          elif [ "${{ inputs.test_mode }}" == "medium" ]; then
            locust -f load_testing/locustfile.py --headless -u 20 -r 2 -t 2m --host $BASE_URL
          elif [ "${{ inputs.test_mode }}" == "stress" ]; then
            locust -f load_testing/locustfile.py --headless --step-load -u 50 --step-users 5 --step-time 10s -t 3m --host $BASE_URL
          fi
          
      - name: Upload Excel Load Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dental_CBCT_Load_Test_Report
          path: load_testing/reports/*.xlsx
          retention-days: 14
