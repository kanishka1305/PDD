name: Selenium Automation Suite

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target BASE_URL (defaults to internal mock/server)"
        required: false
        default: "http://127.0.0.1:8000"

permissions:
  contents: read
  actions: read

jobs:
  selenium-tests:
    name: Run Selenium Automation Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dental_ai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl==3.1.5 pytest==8.3.5 pytest-html==4.1.1 uvicorn fastapi mysql-connector-python requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Start FastAPI Application
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: dental_ai
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          timeout 30 bash -c 'until curl -s -f "http://127.0.0.1:8000/health" > /dev/null; do sleep 2; done'

      - name: Run Selenium / UI Test Suite
        env:
          BASE_URL: "http://127.0.0.1:8000"
          HEADLESS: "true"
        run: |
          mkdir -p "Test Results/Excel" "Test Results/HTML" "Test Results/JSON" "Test Results/Summary"
          python -m pytest automation/tests/ -v --tb=short || true
          python automation/utils/generate_automation_report.py

      - name: Upload Selenium Test Report (Excel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports-${{ github.sha }}
          retention-days: 30
          path: |
            Test Results/Excel/*.xlsx
            Test Results/HTML/*.html
